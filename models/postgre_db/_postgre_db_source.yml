version: 2

sources:
  - name: postgre_db
    schema: postgre_db
    database: db_27_BRONZE_DB
    quoting: 
      database: false
      schema: false
      identifier: false
    config: 
      freshness: 
        warn_after: {count:24, period:hour}
        error_after: {count:48, period:hour}
    tables:
      - name: addresses
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: address_id
          - name: zipcode
          - name: country
          - name: address
          - name: state
          - name: _fivetran_deleted
          - name: _fivetran_synced
      - name: orders
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
          - name: shipping_service
          - name: shipping_cost
          - name: address_id
          - name: created_at
          - name: promo_id
          - name: estimated_delivery_at
          - name: order_cost
          - name: user_id
          - name: order_total
          - name: delivered_at
          - name: tracking_id
          - name: status
          - name: _fivetran_deleted
          - name: _fivetran_synced
